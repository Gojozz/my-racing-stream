name: YouTube Live Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            chromium \
            imagemagick \
            mesa-utils \
            libgl1-mesa-dri

      - name: Check dependencies
        run: |
          echo "===== FFMPEG ====="
          command -v ffmpeg
          ffmpeg -version | head -1

          echo "===== CHROMIUM ====="
          command -v chromium
          chromium --version

      - name: Start Stream
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}

        run: |
          set -e

          echo "===== START XVFB ====="
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          sleep 3

          echo "===== START HTTP SERVER ====="
          python3 -m http.server 8000 > http.log 2>&1 &
          sleep 3

          echo "===== START CHROMIUM 3D ====="

          chromium \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu-sandbox \
            --ignore-gpu-blocklist \
            --enable-webgl \
            --use-angle=swiftshader \
            --enable-unsafe-swiftshader \
            --window-size=1280,720 \
            --kiosk \
            --no-first-run \
            http://127.0.0.1:8000/index.html &

          sleep 10

          echo "===== CHROMIUM PROCESS ====="
          ps aux | grep chromium | grep -v grep || true

          echo "===== SCREEN TEST ====="
          import -display :99 -window root /tmp/stream-screen.png
          file /tmp/stream-screen.png

          echo "===== START FFMPEG ====="

          ffmpeg \
            -draw_mouse 0 \
            -f x11grab \
            -video_size 1280x720 \
            -framerate 30 \
            -i :99.0 \
            -f lavfi \
            -i anullsrc=channel_layout=stereo:sample_rate=44100 \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -pix_fmt yuv420p \
            -r 30 \
            -b:v 2500k \
            -maxrate 2500k \
            -bufsize 5000k \
            -g 60 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY"

      - name: Upload diagnostic screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-diagnostic
          path: |
            /tmp/stream-screen.png
            http.log

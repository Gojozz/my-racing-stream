name: YouTube Live Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies & FFmpeg
        run: |
          sudo apt-get update
          pip install -r requirements.txt

      - name: Start Stream
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          YOUTUBE_LIVE_ID: ${{ secrets.YOUTUBE_LIVE_ID }}
        run: |
          # 1. Jalankan layar virtual (Xvfb)
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          sleep 2

          # 2. Jalankan HTTP server lokal
          python -m http.server 8000 &
          sleep 3

          # 3. Jalankan Chromium Mode Kiosk + SwiftShader (Render 3D via CPU)
          chromium-browser \
            --no-sandbox \
            --disable-setuid-sandbox \
            --test-type \
            --kiosk \
            --window-size=1280,720 \
            --window-position=0,0 \
            --ignore-gpu-blocklist \
            --enable-webgl \
            --use-gl=swiftshader \
            --disable-dev-shm-usage \
            --no-first-run \
            http://localhost:8000 &
          sleep 5

          # 4. Jalankan bot chat Python di background
          python bot.py &

          # 5. Stream ke YouTube via FFmpeg
          ffmpeg -draw_mouse 0 -f x11grab -video_size 1280x720 -i :99.0 \
            -f lavfi -i anullsrc \
            -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv "rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY"

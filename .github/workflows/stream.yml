name: YouTube Live Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb chromium
          pip install -r requirements.txt

          echo "===== FFMPEG CHECK ====="
          command -v ffmpeg
          ffmpeg -version | head -1

          echo "===== CHROMIUM CHECK ====="
          command -v chromium

      - name: Start Stream
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}

        run: |
          set -e

          echo "===== STARTING STREAM ====="

          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe

          echo "===== START XVFB ====="
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          sleep 3

          echo "===== START HTTP SERVER ====="
          python -m http.server 8000 > http.log 2>&1 &
          sleep 3

          echo "===== START CHROMIUM ====="

          chromium \
            --no-sandbox \
            --disable-setuid-sandbox \
            --disable-gpu-sandbox \
            --ignore-gpu-blocklist \
            --enable-webgl \
            --use-angle=swiftshader \
            --enable-unsafe-swiftshader \
            --window-size=1280,720 \
            --window-position=0,0 \
            --start-fullscreen \
            --kiosk \
            --disable-dev-shm-usage \
            --no-first-run \
            http://127.0.0.1:8000 &

          sleep 8

          echo "===== CHROMIUM STARTED ====="

          echo "===== STARTING FFMPEG ====="

          ffmpeg \
            -draw_mouse 0 \
            -f x11grab \
            -video_size 1280x720 \
            -framerate 30 \
            -i :99.0 \
            -f lavfi \
            -i anullsrc=channel_layout=stereo:sample_rate=44100 \
            -c:v libx264 \
            -preset ultrafast \
            -tune zerolatency \
            -pix_fmt yuv420p \
            -r 30 \
            -b:v 2500k \
            -maxrate 2500k \
            -bufsize 5000k \
            -g 60 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY"

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>3D AI Multi-Car Race</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #8fcaf0;
        font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    /* =========================
       HUD
    ========================= */

    #hud {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 20;
        pointer-events: none;
    }

    .hud-card {
        min-width: 285px;
        padding: 14px 18px 16px;

        background: rgba(8, 14, 22, 0.86);

        border-left: 5px solid #00bfe8;
        border-radius: 8px;

        box-shadow:
            0 8px 30px rgba(0,0,0,0.30);

        backdrop-filter: blur(5px);
    }

    .hud-title {
        margin-bottom: 3px;

        font-size: 12px;
        font-weight: 800;
        letter-spacing: 3px;

        color: #00c9ee;
        text-transform: uppercase;
    }

    .hud-value {
        margin-bottom: 13px;

        font-size: 31px;
        line-height: 1;

        font-weight: 900;
        font-style: italic;

        color: #ffffff;

        text-shadow:
            0 2px 5px rgba(0,0,0,0.5);
    }

    #leaderboard {
        margin-top: 5px;
    }

    .leader-item {
        display: flex;
        justify-content: space-between;
        align-items: center;

        gap: 25px;

        margin: 7px 0;

        font-size: 16px;
        font-weight: 800;

        white-space: nowrap;
    }

    .p1 {
        color: #ffd21c;
    }

    .p2 {
        color: #ffffff;
    }

    .p3 {
        color: #d18a45;
    }

    .p4 {
        color: #8fcaff;
    }

    .p5 {
        color: #bcbcbc;
    }

    /* =========================
       FINISH
    ========================= */

    #finish-banner {
        position: fixed;

        top: 50%;
        left: 50%;

        transform: translate(-50%, -50%);

        z-index: 30;

        display: none;

        color: #ffffff;

        font-size: clamp(42px, 7vw, 82px);
        font-weight: 1000;
        font-style: italic;

        letter-spacing: 4px;

        text-align: center;

        text-shadow:
            0 4px 0 #d40000,
            0 0 20px rgba(255,40,40,0.9),
            0 0 45px rgba(255,255,255,0.8);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

        #hud {
            top: 12px;
            left: 12px;
        }

        .hud-card {
            min-width: 235px;
            padding: 11px 14px;
        }

        .hud-title {
            font-size: 10px;
            letter-spacing: 2px;
        }

        .hud-value {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .leader-item {
            font-size: 14px;
            gap: 18px;
            margin: 5px 0;
        }
    }
</style>
</head>

<body>

<div id="hud">

    <div class="hud-card">

        <div class="hud-title">
            LAP
        </div>

        <div
            class="hud-value"
            id="lap-display">
            1 / 3
        </div>

        <div class="hud-title">
            POSISI BALAPAN
        </div>

        <div id="leaderboard"></div>

    </div>

</div>

<div id="finish-banner">
    FINISH!
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

"use strict";

/* =========================================================
   KONFIGURASI
========================================================= */

const TOTAL_LAPS = 3;

const TRACK_WIDTH = 16;

let isRaceFinished = false;
let raceResetTimer = null;


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x8fcaf0);

scene.fog = new THREE.Fog(
    0xb9dded,
    170,
    650
);


/* =========================================================
   CAMERA
========================================================= */

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1200
);

camera.position.set(
    0,
    12,
    25
);


/* =========================================================
   RENDERER
========================================================= */

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

/*
 * Penting untuk GitHub Actions.
 * Jangan gunakan pixelRatio 2.
 */
renderer.setPixelRatio(1);

/*
 * Three.js r128 menggunakan outputEncoding,
 * bukan outputColorSpace.
 */
renderer.outputEncoding = THREE.sRGBEncoding;

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHT
========================================================= */

const hemiLight =
    new THREE.HemisphereLight(
        0xd7ecff,
        0x355a2d,
        0.75
    );

scene.add(hemiLight);


const sunLight =
    new THREE.DirectionalLight(
        0xfff1d2,
        1.15
    );

sunLight.position.set(
    120,
    220,
    100
);

sunLight.castShadow = true;

sunLight.shadow.mapSize.width = 1024;
sunLight.shadow.mapSize.height = 1024;

sunLight.shadow.camera.left = -300;
sunLight.shadow.camera.right = 300;
sunLight.shadow.camera.top = 300;
sunLight.shadow.camera.bottom = -300;

sunLight.shadow.camera.far = 600;

sunLight.shadow.bias = -0.001;

scene.add(sunLight);


/* =========================================================
   GROUND
========================================================= */

const groundGeo =
    new THREE.PlaneGeometry(
        2000,
        2000
    );

const groundMat =
    new THREE.MeshLambertMaterial({
        color: 0x548b42
    });

const ground =
    new THREE.Mesh(
        groundGeo,
        groundMat
    );

ground.rotation.x =
    -Math.PI / 2;

ground.position.y = -1.05;

ground.receiveShadow = true;

scene.add(ground);


/* =========================================================
   RUMPUT BERGARIS
========================================================= */

const stripeGroup =
    new THREE.Group();

for (
    let i = -40;
    i < 40;
    i++
) {

    const stripeGeo =
        new THREE.PlaneGeometry(
            2000,
            12
        );

    const stripeMat =
        new THREE.MeshLambertMaterial({
            color:
                i % 2 === 0
                    ? 0x548b42
                    : 0x4e833d
        });

    const stripe =
        new THREE.Mesh(
            stripeGeo,
            stripeMat
        );

    stripe.rotation.x =
        -Math.PI / 2;

    stripe.position.set(
        0,
        -1.04,
        i * 12
    );

    stripe.receiveShadow = true;

    stripeGroup.add(stripe);
}

scene.add(stripeGroup);


/* =========================================================
   TRACK CURVE
========================================================= */

const trackPoints = [

    new THREE.Vector3(
        0, 0, 0
    ),

    new THREE.Vector3(
        120, 0, 60
    ),

    new THREE.Vector3(
        200, 0, -30
    ),

    new THREE.Vector3(
        240, 0, -150
    ),

    new THREE.Vector3(
        130, 0, -240
    ),

    new THREE.Vector3(
        10, 0, -180
    ),

    new THREE.Vector3(
        -90, 0, -250
    ),

    new THREE.Vector3(
        -200, 0, -160
    ),

    new THREE.Vector3(
        -140, 0, -50
    ),

    new THREE.Vector3(
        -60, 0, 30
    )

];


const trackCurve =
    new THREE.CatmullRomCurve3(
        trackPoints,
        true,
        "catmullrom",
        0.5
    );


/* =========================================================
   ROAD MESH
   JALAN DATAR — BUKAN TUBE
========================================================= */

function createRoad() {

    const segments = 500;

    const positions = [];
    const normals = [];
    const uvs = [];
    const indices = [];

    const roadY = -0.68;

    for (
        let i = 0;
        i <= segments;
        i++
    ) {

        const t =
            i / segments;

        const point =
            trackCurve.getPointAt(t);

        const tangent =
            trackCurve.getTangentAt(t);

        const side =
            new THREE.Vector3(
                -tangent.z,
                0,
                tangent.x
            ).normalize();

        const left =
            point.clone().add(
                side.clone().multiplyScalar(
                    TRACK_WIDTH
                )
            );

        const right =
            point.clone().add(
                side.clone().multiplyScalar(
                    -TRACK_WIDTH
                )
            );

        positions.push(
            left.x,
            roadY,
            left.z
        );

        positions.push(
            right.x,
            roadY,
            right.z
        );

        normals.push(
            0, 1, 0,
            0, 1, 0
        );

        uvs.push(
            0, t * 40,
            1, t * 40
        );
    }

    for (
        let i = 0;
        i < segments;
        i++
    ) {

        const a = i * 2;
        const b = a + 1;
        const c = a + 2;
        const d = a + 3;

        indices.push(
            a, b, c,
            b, d, c
        );
    }

    const geometry =
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,
            3
        )
    );

    geometry.setAttribute(
        "normal",
        new THREE.Float32BufferAttribute(
            normals,
            3
        )
    );

    geometry.setAttribute(
        "uv",
        new THREE.Float32BufferAttribute(
            uvs,
            2
        )
    );

    geometry.setIndex(indices);

    geometry.computeBoundingSphere();

    const material =
        new THREE.MeshStandardMaterial({

            color: 0x34373a,

            roughness: 0.95,

            metalness: 0.02
        });

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.receiveShadow = true;

    scene.add(mesh);

    return mesh;
}

createRoad();


/* =========================================================
   ROAD SHOULDER
========================================================= */

function createShoulder(
    offsetSign
) {

    const group =
        new THREE.Group();

    const segments = 260;

    for (
        let i = 0;
        i < segments;
        i++
    ) {

        const t =
            i / segments;

        const point =
            trackCurve.getPointAt(t);

        const tangent =
            trackCurve.getTangentAt(t);

        const side =
            new THREE.Vector3(
                -tangent.z,
                0,
                tangent.x
            ).normalize();

        const pos =
            point.clone().add(
                side.multiplyScalar(
                    offsetSign *
                    (TRACK_WIDTH + 1.2)
                )
            );

        const geo =
            new THREE.BoxGeometry(
                1.6,
                0.12,
                2.4
            );

        const mat =
            new THREE.MeshStandardMaterial({
                color:
                    i % 2 === 0
                        ? 0xd52222
                        : 0xf2f2f2,
                roughness: 0.8
            });

        const curb =
            new THREE.Mesh(
                geo,
                mat
            );

        curb.position.copy(pos);

        curb.position.y =
            -0.58;

        curb.lookAt(
            pos.clone().add(tangent)
        );

        curb.castShadow = true;
        curb.receiveShadow = true;

        group.add(curb);
    }

    scene.add(group);
}

createShoulder(1);
createShoulder(-1);


/* =========================================================
   CENTER ROAD MARKING
========================================================= */

const laneMarkGroup =
    new THREE.Group();

const laneSegments = 180;

for (
    let i = 0;
    i < laneSegments;
    i += 2
) {

    const t =
        i / laneSegments;

    const point =
        trackCurve.getPointAt(t);

    const tangent =
        trackCurve.getTangentAt(t);

    const geo =
        new THREE.BoxGeometry(
            0.35,
            0.045,
            3.5
        );

    const mat =
        new THREE.MeshBasicMaterial({
            color: 0xffffff
        });

    const dash =
        new THREE.Mesh(
            geo,
            mat
        );

    dash.position.copy(point);

    dash.position.y =
        -0.60;

    dash.lookAt(
        point.clone().add(tangent)
    );

    laneMarkGroup.add(dash);
}

scene.add(laneMarkGroup);


/* =========================================================
   CHECKPOINT GATES
========================================================= */

function createGate(
    point,
    tangent,
    index
) {

    const gate =
        new THREE.Group();

    const color =
        index % 2 === 0
            ? 0x00a9d6
            : 0xe34d8d;

    const mat =
        new THREE.MeshStandardMaterial({
            color: color,
            roughness: 0.45,
            metalness: 0.15
        });


    const postGeo =
        new THREE.BoxGeometry(
            0.7,
            6,
            0.7
        );


    const left =
        new THREE.Mesh(
            postGeo,
            mat
        );

    const right =
        new THREE.Mesh(
            postGeo,
            mat
        );

    left.position.x =
        -TRACK_WIDTH + 1;

    right.position.x =
        TRACK_WIDTH - 1;


    const topGeo =
        new THREE.BoxGeometry(
            TRACK_WIDTH * 2,
            0.7,
            0.7
        );

    const top =
        new THREE.Mesh(
            topGeo,
            mat
        );

    top.position.y = 6;


    gate.add(
        left,
        right,
        top
    );


    gate.position.copy(point);

    gate.position.y =
        -0.65;

    gate.lookAt(
        point.clone().add(tangent)
    );

    gate.traverse(
        obj => {

            if (obj.isMesh) {

                obj.castShadow = true;

                obj.receiveShadow = true;
            }
        }
    );

    scene.add(gate);
}


trackPoints.forEach(
    (point, index) => {

        const t =
            index /
            trackPoints.length;

        const tangent =
            trackCurve.getTangentAt(t);

        createGate(
            point,
            tangent,
            index
        );
    }
);


/* =========================================================
   FINISH LINE
========================================================= */

const startPoint =
    trackCurve.getPointAt(0);

const finishGeo =
    new THREE.BoxGeometry(
        TRACK_WIDTH * 2,
        0.08,
        2.4
    );

const finishMat =
    new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.7
    });

const finishLine =
    new THREE.Mesh(
        finishGeo,
        finishMat
    );

finishLine.position.copy(
    startPoint
);

finishLine.position.y =
    -0.60;

const finishTangent =
    trackCurve.getTangentAt(0);

finishLine.lookAt(
    startPoint.clone().add(
        finishTangent
    )
);

scene.add(finishLine);


/* =========================================================
   TREES
========================================================= */

function createTree() {

    const tree =
        new THREE.Group();


    const trunkGeo =
        new THREE.CylinderGeometry(
            0.35,
            0.55,
            3,
            8
        );

    const trunkMat =
        new THREE.MeshLambertMaterial({
            color: 0x6b4328
        });

    const trunk =
        new THREE.Mesh(
            trunkGeo,
            trunkMat
        );

    trunk.position.y =
        1.5;

    trunk.castShadow = true;

    tree.add(trunk);


    const leavesGeo =
        new THREE.ConeGeometry(
            2.6,
            5.5,
            10
        );

    const leavesMat =
        new THREE.MeshLambertMaterial({
            color: 0x347a35
        });

    const leaves =
        new THREE.Mesh(
            leavesGeo,
            leavesMat
        );

    leaves.position.y =
        5;

    leaves.castShadow = true;

    tree.add(leaves);

    return tree;
}


const decorGroup =
    new THREE.Group();

for (
    let i = 0;
    i < 75;
    i++
) {

    const t =
        Math.random();

    const point =
        trackCurve.getPointAt(t);

    const tangent =
        trackCurve.getTangentAt(t);

    const side =
        new THREE.Vector3(
            -tangent.z,
            0,
            tangent.x
        ).normalize();

    const distance =
        TRACK_WIDTH +
        14 +
        Math.random() * 30;

    const direction =
        Math.random() > 0.5
            ? 1
            : -1;

    const pos =
        point.clone().add(
            side.multiplyScalar(
                direction * distance
            )
        );

    const tree =
        createTree();

    tree.position.set(
        pos.x,
        -1.05,
        pos.z
    );

    const scale =
        0.75 +
        Math.random() * 0.55;

    tree.scale.setScalar(
        scale
    );

    tree.rotation.y =
        Math.random() *
        Math.PI * 2;

    decorGroup.add(tree);
}

scene.add(decorGroup);


/* =========================================================
   MOBIL
========================================================= */

function createWheel() {
    const wheelGroup = new THREE.Group();

    const tireGeo = new THREE.CylinderGeometry(
        0.42,
        0.42,
        0.32,
        20
    );

    const tireMat = new THREE.MeshStandardMaterial({
        color: 0x101010,
        roughness: 0.9
    });

    const tire = new THREE.Mesh(
        tireGeo,
        tireMat
    );

    tire.rotation.z = Math.PI / 2;
    tire.castShadow = true;
    wheelGroup.add(tire);

    const rimGeo = new THREE.CylinderGeometry(
        0.24,
        0.24,
        0.34,
        12
    );

    const rimMat = new THREE.MeshStandardMaterial({
        color: 0xc9c9c9,
        metalness: 0.8,
        roughness: 0.3
    });

    const rim = new THREE.Mesh(
        rimGeo,
        rimMat
    );

    rim.rotation.z = Math.PI / 2;
    wheelGroup.add(rim);

    return wheelGroup;
}


function createCarMesh(colorHex) {
    const carGroup = new THREE.Group();

    const bodyMat = new THREE.MeshStandardMaterial({
        color: colorHex,
        metalness: 0.55,
        roughness: 0.35
    });

    const darkMat = new THREE.MeshStandardMaterial({
        color: 0x0d0d0f,
        metalness: 0.3,
        roughness: 0.5
    });

    const glassMat = new THREE.MeshStandardMaterial({
        color: 0x1c2a3a,
        metalness: 0.9,
        roughness: 0.1,
        transparent: true,
        opacity: 0.75
    });

    const lightMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0xffffff,
        emissiveIntensity: 1.2
    });

    const tailMat = new THREE.MeshStandardMaterial({
        color: 0xff2222,
        emissive: 0xaa0000,
        emissiveIntensity: 0.9
    });


    // Chassis
    const baseGeo = new THREE.BoxGeometry(
        2.0,
        0.35,
        4.4
    );

    const base = new THREE.Mesh(
        baseGeo,
        darkMat
    );

    base.position.y = 0.32;
    base.castShadow = true;
    carGroup.add(base);


    // Bodi utama
    const bodyGeo = new THREE.BoxGeometry(
        2.1,
        0.55,
        3.6
    );

    const body = new THREE.Mesh(
        bodyGeo,
        bodyMat
    );

    body.position.y = 0.68;
    body.castShadow = true;
    carGroup.add(body);


    // Hidung depan
    const noseGeo = new THREE.BoxGeometry(
        1.9,
        0.4,
        0.9
    );

    const nose = new THREE.Mesh(
        noseGeo,
        bodyMat
    );

    nose.position.set(
        0,
        0.55,
        2.15
    );

    nose.rotation.x = -0.18;
    nose.castShadow = true;
    carGroup.add(nose);


    // Kabin
    const cabinGeo = new THREE.BoxGeometry(
        1.55,
        0.5,
        1.9
    );

    const cabin = new THREE.Mesh(
        cabinGeo,
        glassMat
    );

    cabin.position.set(
        0,
        1.06,
        -0.2
    );

    cabin.castShadow = true;
    carGroup.add(cabin);


    // Atap
    const roofGeo = new THREE.BoxGeometry(
        1.4,
        0.12,
        1.3
    );

    const roof = new THREE.Mesh(
        roofGeo,
        bodyMat
    );

    roof.position.set(
        0,
        1.34,
        -0.25
    );

    carGroup.add(roof);


    // Spoiler
    const spoilerStandGeo = new THREE.BoxGeometry(
        0.12,
        0.5,
        0.12
    );

    const standL = new THREE.Mesh(
        spoilerStandGeo,
        darkMat
    );

    standL.position.set(
        -0.75,
        0.95,
        -2.05
    );

    carGroup.add(standL);

    const standR = standL.clone();

    standR.position.x = 0.75;
    carGroup.add(standR);


    const spoilerWingGeo = new THREE.BoxGeometry(
        1.9,
        0.1,
        0.5
    );

    const spoilerWing = new THREE.Mesh(
        spoilerWingGeo,
        darkMat
    );

    spoilerWing.position.set(
        0,
        1.2,
        -2.1
    );

    spoilerWing.castShadow = true;
    carGroup.add(spoilerWing);


    // Lampu depan
    const lightGeo = new THREE.BoxGeometry(
        0.45,
        0.16,
        0.08
    );

    const leftLight = new THREE.Mesh(
        lightGeo,
        lightMat
    );

    leftLight.position.set(
        -0.7,
        0.62,
        2.6
    );

    carGroup.add(leftLight);

    const rightLight = leftLight.clone();

    rightLight.position.x = 0.7;
    carGroup.add(rightLight);


    // Lampu belakang
    const tailGeo = new THREE.BoxGeometry(
        0.4,
        0.18,
        0.08
    );

    const leftTail = new THREE.Mesh(
        tailGeo,
        tailMat
    );

    leftTail.position.set(
        -0.75,
        0.68,
        -2.18
    );

    carGroup.add(leftTail);

    const rightTail = leftTail.clone();

    rightTail.position.x = 0.75;
    carGroup.add(rightTail);


    // Roda
    const wheelPositions = [
        [-1.05, 0.15, 1.35],
        [1.05, 0.15, 1.35],
        [-1.05, 0.15, -1.35],
        [1.05, 0.15, -1.35]
    ];

    wheelPositions.forEach(pos => {
        const wheel = createWheel();

        wheel.position.set(
            pos[0],
            pos[1],
            pos[2]
        );

        carGroup.add(wheel);
    });


    carGroup.traverse(obj => {
        if (obj.isMesh) {
            obj.castShadow = true;
        }
    });

    return carGroup;
}


/* =========================================================
   5 MOBIL AI
========================================================= */

const cars = [
    {
        name: "Merah",
        color: "#e8232f",
        mesh: createCarMesh(0xe8232f),
        progress: 0.000,
        baseSpeed: 0.00078,
        laneOffset: -6.0,
        targetLane: -6.0,
        lap: 1,
        totalDistance: 0
    },

    {
        name: "Biru",

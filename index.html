<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>3D AI Multi-Car Race</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #8fcaf0;
        font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    /* =========================
       HUD
    ========================= */

    #hud {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 20;
        pointer-events: none;
    }

    .hud-card {
        min-width: 285px;
        padding: 14px 18px 16px;

        background: rgba(8, 14, 22, 0.86);

        border-left: 5px solid #00bfe8;
        border-radius: 8px;

        box-shadow:
            0 8px 30px rgba(0,0,0,0.30);

        backdrop-filter: blur(5px);
    }

    .hud-title {
        margin-bottom: 3px;

        font-size: 12px;
        font-weight: 800;
        letter-spacing: 3px;

        color: #00c9ee;
        text-transform: uppercase;
    }

    .hud-value {
        margin-bottom: 13px;

        font-size: 31px;
        line-height: 1;

        font-weight: 900;
        font-style: italic;

        color: #ffffff;

        text-shadow:
            0 2px 5px rgba(0,0,0,0.5);
    }

    #leaderboard {
        margin-top: 5px;
    }

    .leader-item {
        display: flex;
        justify-content: space-between;
        align-items: center;

        gap: 25px;

        margin: 7px 0;

        font-size: 16px;
        font-weight: 800;

        white-space: nowrap;
    }

    .p1 {
        color: #ffd21c;
    }

    .p2 {
        color: #ffffff;
    }

    .p3 {
        color: #d18a45;
    }

    .p4 {
        color: #8fcaff;
    }

    .p5 {
        color: #bcbcbc;
    }

    /* =========================
       CHAT PLAYER / QUEUE
    ========================= */
    #chat-panels {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 25;
        width: 235px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        pointer-events: none;
    }

    .chat-panel {
        background: rgba(8, 14, 22, 0.88);
        border: 1px solid rgba(0, 201, 238, 0.45);
        border-radius: 9px;
        padding: 10px 12px;
        box-shadow: 0 8px 25px rgba(0,0,0,.28);
        backdrop-filter: blur(5px);
    }

    .chat-panel-title {
        color: #00c9ee;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 2px;
        margin-bottom: 7px;
    }

    .chat-player,
    .chat-queue {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #fff;
        font-size: 12px;
        font-weight: 800;
        margin: 5px 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .chat-number {
        min-width: 20px;
        height: 20px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(255,255,255,.14);
        font-size: 10px;
    }

    .chat-queue-empty {
        color: #8d9aa5;
        font-size: 11px;
        font-weight: 700;
    }

    .car-player-label {
        position: fixed;
        z-index: 18;
        transform: translate(-50%, -100%);
        padding: 3px 7px;
        border-radius: 5px;
        background: rgba(5, 9, 14, .88);
        border: 1px solid rgba(255,255,255,.35);
        color: #fff;
        font-size: 11px;
        font-weight: 900;
        white-space: nowrap;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
    }

    @media (max-width: 700px) {
        #chat-panels {
            top: 12px;
            right: 12px;
            width: 175px;
        }

        .chat-panel {
            padding: 8px 9px;
        }

        .chat-panel-title {
            font-size: 9px;
        }

        .chat-player,
        .chat-queue {
            font-size: 10px;
        }

        .car-player-label {
            font-size: 9px;
            padding: 2px 5px;
        }
    }


    /* =========================
       COUNTDOWN
    ========================= */
    #countdown-overlay {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        background: rgba(0,0,0,0.25);
    }

    #countdown-text {
        font-size: clamp(80px, 18vw, 160px);
        font-weight: 1000;
        font-style: italic;
        color: #fff;
        text-shadow:
            0 4px 0 #d40000,
            0 0 30px rgba(255,40,40,0.9),
            0 0 60px rgba(255,255,255,0.7);
        letter-spacing: 6px;
        animation: countdownPop 0.35s ease-out;
    }

    @keyframes countdownPop {
        0% { transform: scale(0.4); opacity: 0; }
        60% { transform: scale(1.15); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
    }

    /* =========================
       FINISH
    ========================= */

    #finish-banner {
        position: fixed;

        top: 50%;
        left: 50%;

        transform: translate(-50%, -50%);

        z-index: 30;

        display: none;

        color: #ffffff;

        font-size: clamp(42px, 7vw, 82px);
        font-weight: 1000;
        font-style: italic;

        letter-spacing: 4px;

        text-align: center;

        text-shadow:
            0 4px 0 #d40000,
            0 0 20px rgba(255,40,40,0.9),
            0 0 45px rgba(255,255,255,0.8);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

        #hud {
            top: 12px;
            left: 12px;
        }

        .hud-card {
            min-width: 235px;
            padding: 11px 14px;
        }

        .hud-title {
            font-size: 10px;
            letter-spacing: 2px;
        }

        .hud-value {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .leader-item {
            font-size: 14px;
            gap: 18px;
            margin: 5px 0;
        }
    }
</style>
</head>

<body>

<div id="hud">

    <div class="hud-card">

        <div class="hud-title">
            LAP
        </div>

        <div
            class="hud-value"
            id="lap-display">
            1 / 3
        </div>

        <div class="hud-title">
            POSISI BALAPAN
        </div>

        <div id="leaderboard"></div>

    </div>

</div>

<div id="chat-panels">

    <div class="chat-panel">
        <div class="chat-panel-title">
            PEMBALAP <span id="active-count">0/5</span>
        </div>
        <div id="chat-active-list"></div>
    </div>

    <div class="chat-panel">
        <div class="chat-panel-title">
            ANTRIAN <span id="queue-count">0</span>
        </div>
        <div id="chat-queue-list"></div>
    </div>

</div>

<div id="finish-banner">
    FINISH!
</div>

<div id="countdown-overlay">
    <div id="countdown-text">3</div>
</div>



<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

"use strict";

/* =========================================================
   KONFIGURASI
========================================================= */

const TOTAL_LAPS = 3;

const TRACK_WIDTH = 16;

let isRaceFinished = false;
let raceResetTimer = null;


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x8fcaf0);

scene.fog = new THREE.Fog(
    0xb9dded,
    170,
    650
);


/* =========================================================
   CAMERA
========================================================= */

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1200
);

camera.position.set(
    0,
    12,
    25
);


/* =========================================================
   RENDERER
========================================================= */

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

/*
 * Penting untuk GitHub Actions.
 * Jangan gunakan pixelRatio 2.
 */
renderer.setPixelRatio(1);

/*
 * Three.js r128 menggunakan outputEncoding,
 * bukan outputColorSpace.
 */
renderer.outputEncoding = THREE.sRGBEncoding;

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHT
========================================================= */

const hemiLight =
    new THREE.HemisphereLight(
        0xd7ecff,
        0x355a2d,
        0.45
    );

scene.add(hemiLight);


const sunLight =
    new THREE.DirectionalLight(
        0xfff1d2,
        0.75
    );

sunLight.position.set(
    120,
    220,
    100
);

sunLight.castShadow = true;

sunLight.shadow.mapSize.width = 1024;
sunLight.shadow.mapSize.height = 1024;

sunLight.shadow.camera.left = -300;
sunLight.shadow.camera.right = 300;
sunLight.shadow.camera.top = 300;
sunLight.shadow.camera.bottom = -300;

sunLight.shadow.camera.far = 600;

sunLight.shadow.bias = -0.001;

scene.add(sunLight);


/* =========================================================
   GROUND
========================================================= */

const groundGeo =
    new THREE.PlaneGeometry(
        2000,
        2000
    );

const groundMat =
    new THREE.MeshLambertMaterial({
        color: 0x548b42
    });

const ground =
    new THREE.Mesh(
        groundGeo,
        groundMat
    );

ground.rotation.x =
    -Math.PI / 2;

ground.position.y = -1.05;

ground.receiveShadow = true;

scene.add(ground);


/* =========================================================
   RUMPUT BERGARIS
========================================================= */

const stripeGroup =
    new THREE.Group();

for (
    let i = -40;
    i < 40;
    i++
) {

    const stripeGeo =
        new THREE.PlaneGeometry(
            2000,
            12
        );

    const stripeMat =
        new THREE.MeshLambertMaterial({
            color:
                i % 2 === 0
                    ? 0x548b42
                    : 0x4e833d
        });

    const stripe =
        new THREE.Mesh(
            stripeGeo,
            stripeMat
        );

    stripe.rotation.x =
        -Math.PI / 2;

    stripe.position.set(
        0,
        -1.04,
        i * 12
    );

    stripe.receiveShadow = true;

    stripeGroup.add(stripe);
}

scene.add(stripeGroup);


/* =========================================================
   TRACK CURVE
========================================================= */

const trackPoints = [

    new THREE.Vector3(
        0, 0, 0
    ),

    new THREE.Vector3(
        120, 0, 60
    ),

    new THREE.Vector3(
        200, 0, -30
    ),

    new THREE.Vector3(
        240, 0, -150
    ),

    new THREE.Vector3(
        130, 0, -240
    ),

    new THREE.Vector3(
        10, 0, -180
    ),

    new THREE.Vector3(
        -90, 0, -250
    ),

    new THREE.Vector3(
        -200, 0, -160
    ),

    new THREE.Vector3(
        -140, 0, -50
    ),

    new THREE.Vector3(
        -60, 0, 30
    )

];


const trackCurve =
    new THREE.CatmullRomCurve3(
        trackPoints,
        true,
        "catmullrom",
        0.5
    );


/* =========================================================
   ROAD MESH
   JALAN DATAR — BUKAN TUBE
========================================================= */

function createRoad() {

    const segments = 500;

    const positions = [];
    const normals = [];
    const uvs = [];
    const indices = [];

    const roadY = -0.45;

    for (
        let i = 0;
        i <= segments;
        i++
    ) {

        const t =
            i / segments;

        const point =
            trackCurve.getPointAt(t);

        const tangent =
            trackCurve.getTangentAt(t);

        const side =
            new THREE.Vector3(
                -tangent.z,
                0,
                tangent.x
            ).normalize();

        const left =
            point.clone().add(
                side.clone().multiplyScalar(
                    TRACK_WIDTH
                )
            );

        const right =
            point.clone().add(
                side.clone().multiplyScalar(
                    -TRACK_WIDTH
                )
            );

        positions.push(
            left.x,
            roadY,
            left.z
        );

        positions.push(
            right.x,
            roadY,
            right.z
        );

        normals.push(
            0, 1, 0,
            0, 1, 0
        );

        uvs.push(
            0, t * 40,
            1, t * 40
        );
    }

    for (
        let i = 0;
        i < segments;
        i++
    ) {

        const a = i * 2;
        const b = a + 1;
        const c = a + 2;
        const d = a + 3;

        indices.push(
            a, b, c,
            b, d, c
        );
    }

    const geometry =
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,
            3
        )
    );

    geometry.setAttribute(
        "normal",
        new THREE.Float32BufferAttribute(
            normals,
            3
        )
    );

    geometry.setAttribute(
        "uv",
        new THREE.Float32BufferAttribute(
            uvs,
            2
        )
    );

    geometry.setIndex(indices);

    geometry.computeBoundingSphere();

    const material =
        new THREE.MeshBasicMaterial({
            color: 0x555555,
            side: THREE.DoubleSide
        });

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.receiveShadow = true;

    scene.add(mesh);

    return mesh;
}

createRoad();


/* =========================================================
   ROAD SHOULDER
========================================================= */

function createShoulder(
    offsetSign
) {

    const group =
        new THREE.Group();

    const segments = 260;

    for (
        let i = 0;
        i < segments;
        i++
    ) {

        const t =
            i / segments;

        const point =
            trackCurve.getPointAt(t);

        const tangent =
            trackCurve.getTangentAt(t);

        const side =
            new THREE.Vector3(
                -tangent.z,
                0,
                tangent.x
            ).normalize();

        const pos =
            point.clone().add(
                side.multiplyScalar(
                    offsetSign *
                    (TRACK_WIDTH + 1.2)
                )
            );

        const geo =
            new THREE.BoxGeometry(
                1.6,
                0.12,
                2.4
            );

        const mat =
            new THREE.MeshStandardMaterial({
                color:
                    i % 2 === 0
                        ? 0xd52222
                        : 0xf2f2f2,
                roughness: 0.8
            });

        const curb =
            new THREE.Mesh(
                geo,
                mat
            );

        curb.position.copy(pos);

        curb.position.y =
            -0.58;

        curb.lookAt(
            pos.clone().add(tangent)
        );

        curb.castShadow = true;
        curb.receiveShadow = true;

        group.add(curb);
    }

    scene.add(group);
}

createShoulder(1);
createShoulder(-1);


/* =========================================================
   CENTER ROAD MARKING
========================================================= */

const laneMarkGroup =
    new THREE.Group();

const laneSegments = 180;

for (
    let i = 0;
    i < laneSegments;
    i += 2
) {

    const t =
        i / laneSegments;

    const point =
        trackCurve.getPointAt(t);

    const tangent =
        trackCurve.getTangentAt(t);

    const geo =
        new THREE.BoxGeometry(
            0.35,
            0.045,
            3.5
        );

    const mat =
        new THREE.MeshBasicMaterial({
            color: 0xffffff
        });

    const dash =
        new THREE.Mesh(
            geo,
            mat
        );

    dash.position.copy(point);

    dash.position.y =
        -0.60;

    dash.lookAt(
        point.clone().add(tangent)
    );

    laneMarkGroup.add(dash);
}

scene.add(laneMarkGroup);


/* =========================================================
   CHECKPOINT GATES
========================================================= */

function createGate(
    point,
    tangent,
    index
) {

    const gate =
        new THREE.Group();

    const color =
        index % 2 === 0
            ? 0x00a9d6
            : 0xe34d8d;

    const mat =
        new THREE.MeshStandardMaterial({
            color: color,
            roughness: 0.45,
            metalness: 0.15
        });


    const postGeo =
        new THREE.BoxGeometry(
            0.7,
            6,
            0.7
        );


    const left =
        new THREE.Mesh(
            postGeo,
            mat
        );

    const right =
        new THREE.Mesh(
            postGeo,
            mat
        );

    left.position.x =
        -TRACK_WIDTH + 1;

    right.position.x =
        TRACK_WIDTH - 1;


    const topGeo =
        new THREE.BoxGeometry(
            TRACK_WIDTH * 2,
            0.7,
            0.7
        );

    const top =
        new THREE.Mesh(
            topGeo,
            mat
        );

    top.position.y = 6;


    gate.add(
        left,
        right,
        top
    );


    gate.position.copy(point);

    gate.position.y =
        -0.65;

    gate.lookAt(
        point.clone().add(tangent)
    );

    gate.traverse(
        obj => {

            if (obj.isMesh) {

                obj.castShadow = true;

                obj.receiveShadow = true;
            }
        }
    );

    scene.add(gate);
}


trackPoints.forEach(
    (point, index) => {

        const t =
            index /
            trackPoints.length;

        const tangent =
            trackCurve.getTangentAt(t);

        createGate(
            point,
            tangent,
            index
        );
    }
);


/* =========================================================
   START / FINISH CHECKERBOARD
========================================================= */

const startPoint = trackCurve.getPointAt(0);
const finishTangent = trackCurve.getTangentAt(0);

const finishGroup = new THREE.Group();

const tileSize = 2;
const rows = 2;
const cols = 16;

for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {

        const tile = new THREE.Mesh(
            new THREE.BoxGeometry(
                tileSize,
                0.10,
                tileSize
            ),
            new THREE.MeshStandardMaterial({
                color:
                    (row + col) % 2 === 0
                        ? 0xffffff
                        : 0x111111,
                roughness: 0.8
            })
        );

        tile.position.set(
            -TRACK_WIDTH + tileSize / 2 + col * tileSize,
            0,
            -tileSize / 2 + row * tileSize
        );

        tile.receiveShadow = true;
        finishGroup.add(tile);
    }
}

finishGroup.position.copy(startPoint);
finishGroup.position.y = -0.58;

finishGroup.lookAt(
    startPoint.clone().add(finishTangent)
);

scene.add(finishGroup);


/* =========================================================
   BENDERA START / FINISH
========================================================= */

function createRaceFlag(side) {

    const group = new THREE.Group();

    const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.10,
            0.10,
            7,
            8
        ),
        new THREE.MeshStandardMaterial({
            color: 0xe5e5e5,
            metalness: 0.5,
            roughness: 0.4
        })
    );

    pole.position.y = 3.5;
    pole.castShadow = true;
    group.add(pole);

    const flag = new THREE.Mesh(
        new THREE.PlaneGeometry(3.5, 1.8),
        new THREE.MeshStandardMaterial({
            color: side > 0 ? 0xff2020 : 0x1976d2,
            side: THREE.DoubleSide,
            roughness: 0.7
        })
    );

    flag.position.set(
        side * 1.55,
        5.6,
        0
    );

    group.add(flag);

    const sideVector = new THREE.Vector3(
        -finishTangent.z,
        0,
        finishTangent.x
    ).normalize();

    group.position.copy(
        startPoint.clone().add(
            sideVector.multiplyScalar(
                side * (TRACK_WIDTH + 3)
            )
        )
    );

    group.position.y = -1.0;

    group.lookAt(
        group.position.clone().add(finishTangent)
    );

    scene.add(group);
}

createRaceFlag(1);
createRaceFlag(-1);

/* =========================================================
   TRIBUN PENONTON + GEDUNG KOTA
========================================================= */

function createGrandstand() {

    const group = new THREE.Group();

    const baseMat = new THREE.MeshStandardMaterial({
        color: 0x555b63,
        roughness: 0.9
    });

    const seatMat = new THREE.MeshStandardMaterial({
        color: 0x2f78a8,
        roughness: 0.8
    });

    // Struktur dasar tribun
    const base = new THREE.Mesh(
        new THREE.BoxGeometry(28, 3, 8),
        baseMat
    );

    base.position.y = 0.5;
    base.castShadow = true;
    base.receiveShadow = true;

    group.add(base);

    // Baris tempat duduk sederhana
    for (let row = 0; row < 4; row++) {

        const seats = new THREE.Mesh(
            new THREE.BoxGeometry(
                25,
                0.55,
                1.3
            ),
            seatMat
        );

        seats.position.set(
            0,
            2.2 + row * 1.0,
            -2.5 + row * 1.4
        );

        seats.castShadow = true;

        group.add(seats);

        // Penonton ringan
        for (let i = 0; i < 12; i++) {

            const person = new THREE.Mesh(
                new THREE.SphereGeometry(
                    0.22,
                    6,
                    6
                ),
                new THREE.MeshLambertMaterial({
                    color:
                        i % 3 === 0
                            ? 0xffd54f
                            : i % 3 === 1
                                ? 0xffffff
                                : 0xff5555
                })
            );

            person.position.set(
                -10 + i * 1.8,
                2.8 + row * 1.0,
                -2.8 + row * 1.4
            );

            group.add(person);
        }
    }

    return group;
}


/* Tribun kiri dan kanan lintasan */

const stadium1 = createGrandstand();
const stadium2 = createGrandstand();

const stadiumPoint =
    trackCurve.getPointAt(0.25);

const stadiumTangent =
    trackCurve.getTangentAt(0.25);

const stadiumSide =
    new THREE.Vector3(
        -stadiumTangent.z,
        0,
        stadiumTangent.x
    ).normalize();

stadium1.position.copy(
    stadiumPoint.clone().add(
        stadiumSide.clone().multiplyScalar(
            TRACK_WIDTH + 18
        )
    )
);

stadium2.position.copy(
    stadiumPoint.clone().add(
        stadiumSide.clone().multiplyScalar(
            -(TRACK_WIDTH + 18)
        )
    )
);

stadium1.rotation.y =
    Math.atan2(
        stadiumTangent.x,
        stadiumTangent.z
    );

stadium2.rotation.y =
    stadium1.rotation.y + Math.PI;

stadium1.scale.setScalar(0.8);
stadium2.scale.setScalar(0.8);

scene.add(stadium1);
scene.add(stadium2);


/* =========================================================
   GEDUNG LOW-POLY
========================================================= */

function createBuilding(height, width, depth) {

    const group = new THREE.Group();

    const buildingMat =
        new THREE.MeshStandardMaterial({
            color:
                0x7a8794 +
                Math.floor(Math.random() * 5) * 0x050505,
            roughness: 0.9
        });

    const building = new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            height,
            depth
        ),
        buildingMat
    );

    building.position.y =
        height / 2 - 1.0;

    building.castShadow = true;
    building.receiveShadow = true;

    group.add(building);

    // Atap
    const roof = new THREE.Mesh(
        new THREE.BoxGeometry(
            width + 0.3,
            0.3,
            depth + 0.3
        ),
        new THREE.MeshStandardMaterial({
            color: 0x34383d,
            roughness: 0.8
        })
    );

    roof.position.y = height - 0.85;

    group.add(roof);

    return group;
}

function tintCarMesh(root, colorHex) {
    root.traverse(obj => {
        if (!obj.isMesh || !obj.material) return;

        const meshName = (obj.name || "").toLowerCase();
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];

        // Cek apakah ini kaca (dari nama mesh ATAU nama material)
        let isGlass = meshName.includes("glass") || meshName.includes("window");
        if (!isGlass) {
            for (const m of mats) {
                const matName = (m.name || "").toLowerCase();
                if (matName.includes("glass") || matName.includes("window")) {
                    isGlass = true;
                    break;
                }
            }
        }

        if (isGlass) {
            obj.material = new THREE.MeshStandardMaterial({
                color: 0x111111,
                metalness: 0.15,
                roughness: 0.2,
                transparent: true,
                opacity: 0.7
            });
            return;
        }

        // Body & lainnya: matte
        mats.forEach(m => {
            if (m.metalness !== undefined) m.metalness = 0.15;
            if (m.roughness !== undefined) m.roughness = 0.75;
            if (m.emissive) m.emissive.setHex(0x000000);
            m.needsUpdate = true;
        });

        obj.castShadow = true;
        obj.receiveShadow = true;
    });
}

function createCarMesh(template, conf) {
    const car = template.clone(true);
    car.scale.setScalar(conf.scale);
    car.position.y = conf.y;
    tintCarMesh(car, conf.hex);
    return car;
}


function createNitroEffect(car) {
    if (!car || !car.mesh || car.nitroFx) return;

    const group = new THREE.Group();

    const flame = new THREE.Mesh(
        new THREE.ConeGeometry(0.18, 0.75, 10),
        new THREE.MeshBasicMaterial({
            color: 0xff8a00,
            transparent: true,
            opacity: 0.9
        })
    );

    flame.rotation.x = Math.PI / 2;
    flame.position.z = 0.55;

    const glow = new THREE.Mesh(
        new THREE.SphereGeometry(0.24, 10, 10),
        new THREE.MeshBasicMaterial({
            color: 0xffcc44,
            transparent: true,
            opacity: 0.55
        })
    );

    glow.position.z = 0.38;

    group.add(flame);
    group.add(glow);

    car.mesh.add(group);

    car.nitroFx = group;
    car.nitroFlame = flame;
}

function updateNitroEffect(car, deltaSeconds) {
    if (!car || !car.mesh) return;

    if (car.nitroTimer > 0) {
        createNitroEffect(car);

        if (car.nitroFx) {
            car.nitroFx.visible = true;

            const pulse =
                0.85 +
                Math.sin(performance.now() * 0.025) * 0.2;

            car.nitroFx.scale.setScalar(pulse);

            if (car.nitroFlame) {
                car.nitroFlame.scale.y =
                    0.85 +
                    Math.random() * 0.45;
            }
        }
    } else if (car.nitroFx) {
        car.nitroFx.visible = false;
    }
}

function buildCars(templates) {
    cars.forEach(c => { if (c.mesh) scene.remove(c.mesh); });
    cars.length = 0;

    const speeds = [0.00078, 0.00076, 0.00075, 0.00077, 0.00074];
    const lanes  = [-6.0, -3.0, 0.0, 3.0, 6.0];

    CAR_MODELS.forEach((conf, i) => {
        const mesh = createCarMesh(templates[i], conf);
        cars.push({
            name: conf.name,
            color: conf.color,
            mesh: mesh,
            progress: i * 0.008,
            baseSpeed: speeds[i],
            laneOffset: lanes[i],
            targetLane: lanes[i],
            lap: 1,
            totalDistance: i * 0.008,
            yOffset: conf.y
        });
        scene.add(mesh);
    });
    console.log("[CAR] 5 mobil berbeda siap");
}

function loadAllCars() {
    const loader = new THREE.GLTFLoader();
    const promises = CAR_MODELS.map(conf => {
        return new Promise((resolve, reject) => {
            loader.load(conf.url, gltf => {
                gltf.scene.traverse(obj => {
                    if (obj.isMesh) {
                        obj.castShadow = true;
                        obj.receiveShadow = true;
                    }
                });
                resolve(gltf.scene);
            }, undefined, reject);
        });
    });

    Promise.all(promises)
        .then(templates => {
            buildCars(templates);
            if (typeof createCarNameLabels === "function") createCarNameLabels();
        })
        .catch(err => {
            console.error("[CAR] Gagal load model:", err);
        });
}

function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
}

function escapeChatText(value) {
    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function createCarNameLabels() {
    cars.forEach(car => {
        if (car.playerLabel) return;

        const label = document.createElement('div');
        label.className = 'car-player-label';
        label.textContent = car.name;
        document.body.appendChild(label);

        car.playerLabel = label;
    });
}

function updateCarNameLabels() {
    const width = window.innerWidth;
    const height = window.innerHeight;

    cars.forEach(car => {
        if (!car.playerLabel) return;

        const p = car.mesh.position.clone();
        p.y += 4.5;
        p.project(camera);

        const x = (p.x * 0.5 + 0.5) * width;
        const y = (-p.y * 0.5 + 0.5) * height;

        if (p.z < -1 || p.z > 1 ||
            x < -100 || x > width + 100 ||
            y < -100 || y > height + 100) {

            car.playerLabel.style.display = 'none';

        } else {

            car.playerLabel.style.display = 'block';
            car.playerLabel.style.left = `${x}px`;
            car.playerLabel.style.top = `${y}px`;
            car.playerLabel.textContent = car.name;
        }
    });
}

function updateChatPanels(active, queue) {
    if (!chatActiveList || !chatQueueList) return;

    activeCountEl.textContent = `${active.length}/5`;
    queueCountEl.textContent = queue.length;

    chatActiveList.innerHTML = active.length
        ? active.map((player, i) => `
            <div class="chat-player">
                <span class="chat-number">${i + 1}</span>
                <span>${escapeChatText(player.name || player.user)}</span>
            </div>
        `).join('')
        : `<div class="chat-queue-empty">Belum ada penonton</div>`;

    chatQueueList.innerHTML = queue.length
        ? queue.slice(0, 10).map((player, i) => `
            <div class="chat-queue">
                <span class="chat-number">${i + 1}</span>
                <span>${escapeChatText(player.name || player.user)}</span>
            </div>

        : `<div class="chat-queue-empty">Antrean kosong</div>`;

async function loadChatState() {
    try {
        const response = await fetch(
            `chat_state.json?t=${Date.now()}`,
            { cache: 'no-store' }
        );

        if (!response.ok) return;

        const state = await response.json();

        const active = Array.isArray(state.active)
            ? state.active
            : [];

        const queue = Array.isArray(state.queue)
            ? state.queue
            : [];

        updateChatPanels(active, queue);

        // =========================================
        // PLAYER GAME CONTROLS
        // =========================================
        active.slice(0, 5).forEach((player, index) => {
            const car = cars[index];
            if (!car) return;

            const controlId = Number(player.controlId || 0);

            if (
                controlId &&
                controlId !== (car.lastControlId || 0)
            ) {
                car.lastControlId = controlId;

                const control = player.control;

                if (control === "nitro") {
                    car.nitroTimer = 2.5;
                    console.log("[NITRO]", car.name);
                }

                if (control === "stop") {
                    car.manualStop = true;
                    console.log("[STOP]", car.name);
                }

                if (control === "gas") {
                    car.manualStop = false;
                    console.log("[GAS]", car.name);
                }
            }
        });

        pendingChatPlayers = active
            .slice(0, 5)
            .map(p => p.name || p.user)
            .filter(Boolean);

        // Sinkronkan nama penonton aktif ke mobil.
        // Tidak mengubah posisi, speed, AI, atau logika balapan.
        cars.forEach((car, index) => {
            car.name = pendingChatPlayers[index] || defaultPlayerNames[index];

            if (car.playerLabel) {
                car.playerLabel.textContent = car.name;
            }
        });

    } catch (err) {
        // chat_state.json belum tersedia / server belum berjalan
    }
}

let raceStarted = false;

let countdownTimer = 0;

const countdownOverlay = document.getElementById('countdown-overlay');
const countdownText = document.getElementById('countdown-text');

function startCountdown() {
    raceStarted = false;
    countdownActive = true;
    countdownValue = 3;
    countdownTimer = 1.0;

    if (countdownOverlay) {
        countdownOverlay.style.display = 'flex';
    }

    if (countdownText) {
        countdownText.textContent = '3';
        countdownText.style.animation = 'none';
        void countdownText.offsetWidth;
        countdownText.style.animation = 'countdownPop 0.35s ease-out';
    }
}

function updateCountdown(deltaSeconds) {
    if (!countdownActive) return;

    countdownTimer -= deltaSeconds;

    if (countdownTimer > 0) return;

    countdownValue -= 1;

    if (countdownValue >= 1) {
        if (countdownText) {
            countdownText.textContent = String(countdownValue);
            countdownText.style.animation = 'none';
            void countdownText.offsetWidth;
            countdownText.style.animation = 'countdownPop 0.35s ease-out';
        }

        countdownTimer = 1.0;

    } else if (countdownValue === 0) {
        if (countdownText) {
            countdownText.textContent = 'GO!';
            countdownText.style.animation = 'none';
            void countdownText.offsetWidth;
            countdownText.style.animation = 'countdownPop 0.35s ease-out';
        }

        countdownTimer = 0.8;

    } else {
        countdownActive = false;
        raceStarted = true;

        if (countdownOverlay) {
            countdownOverlay.style.display = 'none';
        }
    }
}

// =========================================================
// FINISH PHASE
// =========================================================
let raceFinishing = false;
let finishedCount = 0;

function animate() {

    requestAnimationFrame(animate);

    const time = clock.getElapsedTime();

    const now = performance.now();

    // Waktu nyata antar frame.
    // 1.0 = 60 FPS, 2.0 = 30 FPS.
    // Maksimum 50ms untuk mencegah lonjakan saat frame drop.
    const deltaSeconds =
        Math.min(
            (now - lastFrameTime) / 1000,
            0.05
        );

    lastFrameTime = now;

    const frameFactor =

        deltaSeconds * 60;


    // Update countdown setiap frame

    updateCountdown(deltaSeconds);
    if (!isRaceFinished) {

        cars.forEach((car, index) => {

            if (car.finished === undefined) {
                car.finished = false;
            }

            // =====================================================
            // RANDOM AI SPEED
            // Tidak lagi menggunakan sinus atau baseSpeed tetap.
            // Setiap mobil memiliki ritme akselerasi/deselerasi
            // sendiri dan sesekali mendapat burst untuk overtake.
            // =====================================================

            if (car.aiSpeed === undefined) {
                car.aiSpeed =
                    0.00068 +
                    Math.random() * 0.00016;

                car.aiTargetSpeed =
                    0.00058 +
                    Math.random() * 0.00040;

                car.aiTimer =
                    0.5 +
                    Math.random() * 2.0;

                car.aiBurstTimer =
                    2 +
                    Math.random() * 6;
            }

            car.aiTimer -= deltaSeconds;
            car.aiBurstTimer -= deltaSeconds;

            // Tentukan target speed baru secara acak
            if (car.aiTimer <= 0) {

                car.aiTargetSpeed =
                    0.00058 +
                    Math.random() * 0.00040;

                car.aiTimer =
                    0.7 +
                    Math.random() * 2.8;
            }

            // Peluang burst / overtake
            if (car.aiBurstTimer <= 0) {

                if (Math.random() < 0.55) {
                    car.aiTargetSpeed +=
                        0.00008 +
                        Math.random() * 0.00012;
                }

                car.aiBurstTimer =
                    3 +
                    Math.random() * 8;
            }

            // Akselerasi dan deselerasi halus
            const acceleration =
                0.000018 +
                Math.random() * 0.000012;

            if (car.aiSpeed < car.aiTargetSpeed) {
                car.aiSpeed += acceleration * frameFactor;
            } else {
                car.aiSpeed -= acceleration * frameFactor;
            }

            // Batas agar mobil tidak terlalu lambat/cepat
            car.aiSpeed =
                Math.max(
                    0.00052,
                    Math.min(
                        0.00102,
                        car.aiSpeed
                    )
                );

            // =========================================
            // PLAYER CONTROL
            // =========================================
            if (car.nitroTimer === undefined) {
                car.nitroTimer = 0;
            }

            if (car.manualStop === undefined) {
                car.manualStop = false;
            }

            car.nitroTimer = Math.max(
                0,
                car.nitroTimer - deltaSeconds
            );

            updateNitroEffect(car, deltaSeconds);

            let currentSpeed = car.aiSpeed;

            if (car.manualStop) {
                currentSpeed = 0;
            } else if (car.nitroTimer > 0) {
                currentSpeed *= 2.2;
            }

            const distanceThisFrame =
                raceStarted ? (currentSpeed * frameFactor) : 0;

            car.progress +=
                distanceThisFrame;

            car.totalDistance +=
                distanceThisFrame;


            // Hitung lap
            const newLap =
                Math.floor(car.totalDistance) + 1;

            if (newLap !== car.lap) {

                car.lap = newLap;

                if (
                    car.lap > TOTAL_LAPS &&
                    !car.finished
                ) {

                    // Mobil sudah melewati garis finish,
                    // tetapi TETAP melanjutkan pergerakannya.
                    car.finished = true;

                    finishedCount++;

                    // Mobil pertama yang finish memulai
                    // fase kamera finish.
                    if (!raceFinishing) {
                        raceFinishing = true;

                        finishBanner.style.display =
                            'block';
                    }

                    // Race baru benar-benar selesai
                    // setelah SEMUA mobil finish.
                    if (finishedCount >= cars.length) {

                        isRaceFinished = true;

                        // Kirim hasil race ke sistem rotasi.
                        // Pemain dengan jarak paling kecil = posisi terakhir.
                        sendRaceResult();

                        setTimeout(() => {

                            cars.forEach((c, i) => {

                                c.progress =
                                    i * 0.008;

                                c.totalDistance =
                                    c.progress;

                                c.lap = 1;

                                c.finished =
                                    false;

                                // Random speed baru
                                c.aiSpeed =
                                    0.00062 +
                                    Math.random() *
                                    0.00020;

                                c.aiTargetSpeed =
                                    0.00058 +
                                    Math.random() *
                                    0.00040;

                                c.aiTimer =
                                    0.5 +
                                    Math.random() * 2;

                                c.aiBurstTimer =
                                    2 +
                                    Math.random() * 6;
                            });

                            finishedCount = 0;
                            raceFinishing = false;
                            isRaceFinished = false;

                            finishBanner.style.display =
                                'none';

                            // Kamera kembali menjadi spectator
                            spectatorMode = 0;
                            spectatorTimer =
                                4 + Math.random() * 3;

                            // Siapkan race berikutnya
                            startCountdown();
                            prepareNextRaceRotation();

                        }, 5000);
                    }
                }
            }


            // Pindah jalur
            car.laneOffset +=
                (
                    car.targetLane -
                    car.laneOffset
                ) * 0.05;


            // Posisi mobil
            const normProgress =
                car.progress % 1.0;

            const point =
                trackCurve.getPointAt(
                    normProgress
                );

            const tangent =
                trackCurve.getTangentAt(
                    normProgress
                );


            const sideVector =
                new THREE.Vector3(
                    -tangent.z,
                    0,
                    tangent.x
                ).normalize();


            const finalPosition =
                point.clone().add(
                    sideVector.multiplyScalar(
                        car.laneOffset
                    )
                );


            car.mesh.position.copy(
                finalPosition
            );

            car.mesh.position.y = car.yOffset || 0;

            const lookTarget = finalPosition.clone().add(tangent);
            lookTarget.y = car.yOffset || 0;

            car.mesh.lookAt(
                lookTarget
            );

        });


        // Tentukan pemimpin balapan
        const sortedCars =
            [...cars].sort(
                (a, b) =>
                    b.totalDistance -
                    a.totalDistance
            );


        // Update leaderboard
        leaderboardEl.innerHTML =
            sortedCars.map(
                (car, pos) => `
                    <div class="leader-item ${
                        posClasses[pos] || 'p5'
                    }">
                        <span>
                            P${pos + 1} - ${car.name}
                        </span>

                        <span>
                            LAP ${Math.min(
                                car.lap,
                                TOTAL_LAPS
                            )}
                        </span>
                    </div>
                `
            ).join('');



// Update lap utama
lapDisplay.innerText =

let currentRaceId = 1;
let rotationSentForRace = false;

async function sendRaceResult() {
    if (rotationSentForRace) return;

    const ranking = [...cars].sort(
        (a, b) => b.totalDistance - a.totalDistance
    );

    if (ranking.length < 5) return;

    // Pemain paling belakang = jarak total paling kecil.
    const eliminated = ranking[ranking.length - 1];

    if (!eliminated || !eliminated.name) return;

    rotationSentForRace = true;

    console.log(
        `[ROTATION] Race ${currentRaceId} selesai`
    );
    console.log(
        `[ROTATION] Pemain terakhir: ${eliminated.name}`
    );

    try {
        const response = await fetch(
            "http://127.0.0.1:8765/race-result",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    raceId: String(currentRaceId),
                    eliminated: eliminated.name
                })
            }
        );

        const result = await response.text();

        console.log(
            `[ROTATION] Server ${response.status}: ${result}`
        );

        // Beri waktu bot memperbarui chat_state.json.
        setTimeout(loadChatState, 700);

    } catch (error) {
        console.error(
            "[ROTATION] Gagal mengirim hasil race:",
            error
        );
    }
}

function prepareNextRaceRotation() {
    currentRaceId++;
    rotationSentForRace = false;
}

// =========================================================

spectatorTimer -= 1 / 60;

if (spectatorTimer <= 0) {

    // 0 = P1
    // 1 = P2
    // 2 = P3
    // 3 = group
    // 4 = wide

    let nextMode =
        Math.floor(Math.random() * 5);

    // Hindari langsung mengulang mode
    if (nextMode === spectatorMode) {
        nextMode =
            (nextMode + 1) % 5;
    }

    spectatorMode = nextMode;

    // Pergantian setiap 4-7 detik
    spectatorTimer =
        4 + Math.random() * 3;
}

let camCar = sortedCars[0];

if (spectatorMode === 1) {
    camCar =
        sortedCars[1] || sortedCars[0];
}

if (spectatorMode === 2) {
    camCar =
        sortedCars[2] || sortedCars[0];
}

// ---------------------------------------------------------
// P1 / P2 / P3
// ---------------------------------------------------------

// ---------------------------------------------------------
// COUNTDOWN: depan → samping di garis start
// ---------------------------------------------------------
if (countdownActive || !raceStarted) {

    const startPt = trackCurve.getPointAt(0);
    const startTang = trackCurve.getTangentAt(0);
    const side = new THREE.Vector3(-startTang.z, 0, startTang.x).normalize();

    // progress 0 = depan, 1 = samping (selama countdown 3→GO)
    let t = 0;
    if (typeof countdownValue === "number") {
        // countdownValue: 3,2,1,0(GO) → t naik
        t = Math.max(0, Math.min(1, (3 - countdownValue) / 3));
        if (countdownValue <= 0) t = 1;
    }

    const frontPos = startPt.clone()
        .add(startTang.clone().multiplyScalar(14))
        .add(new THREE.Vector3(0, 5, 0));

    const sidePos = startPt.clone()
        .add(side.clone().multiplyScalar(16))
        .add(startTang.clone().multiplyScalar(2))
        .add(new THREE.Vector3(0, 6, 0));

    const wantedPosition = frontPos.clone().lerp(sidePos, t);
    const lookTarget = startPt.clone().add(new THREE.Vector3(0, 1.5, 0));

    camera.position.lerp(wantedPosition, 0.05);
    camera.lookAt(lookTarget);
}
else if (
    spectatorMode === 0 ||
    spectatorMode === 1 ||
    spectatorMode === 2
) {

    const prog =
        camCar.progress % 1.0;

    const pt =
        trackCurve.getPointAt(prog);

    const tang =
        trackCurve.getTangentAt(prog);

    const wantedPosition =
        pt.clone()
            .add(
                tang.clone()
                    .multiplyScalar(-12)
            )
            .add(
                new THREE.Vector3(0, 5.5, 0)
            );

    const wantedLook =
        pt.clone()
            .add(
                tang.clone()
                    .multiplyScalar(8)
            );

    camera.position.lerp(
        wantedPosition,
        0.06
    );

    camera.lookAt(
        wantedLook
    );
}

// ---------------------------------------------------------
// GROUP SHOT
// ---------------------------------------------------------

else if (spectatorMode === 3) {

    // ATAS — lihat seluruh pack mobil
    let sum = 0;
    sortedCars.forEach(c => { sum += c.progress; });
    const average = sum / sortedCars.length;
    const prog = average % 1.0;
    const pt = trackCurve.getPointAt(prog);

    const wantedPosition =
        pt.clone()
            .add(new THREE.Vector3(0, 45, 0));

    camera.position.lerp(wantedPosition, 0.03);
    camera.lookAt(pt);
}

// ---------------------------------------------------------
// WIDE SHOT
// ---------------------------------------------------------

else if (spectatorMode === 4) {

    // ATAS LEBAR — semua mobil + sebagian track
    let sum = 0;
    sortedCars.forEach(c => { sum += c.progress; });
    const average = sum / sortedCars.length;
    const prog = average % 1.0;
    const pt = trackCurve.getPointAt(prog);

    const wantedPosition =
        pt.clone()
            .add(new THREE.Vector3(0, 60, 0));

    camera.position.lerp(wantedPosition, 0.025);
    camera.lookAt(pt);
}

    }

    updateCarNameLabels();
    renderer.render(scene, camera);
}

// Mulai countdown lalu animasi
startCountdown();
animate();

// Responsif terhadap perubahan ukuran layar
function resizeRenderer() {
    const width = window.innerWidth;
    const height = window.innerHeight;

    camera.aspect = width / height;
    camera.updateProjectionMatrix();

    renderer.setSize(width, height, false);
}

window.addEventListener('resize', resizeRenderer);

</script>

        { once: true }
    );
